<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏍️VENOM </title>
    <link rel="stylesheet" href="style.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- ✅ LOGIN PAGE -->
<div id="login-page" class="auth-container">
    <div class="login-box">
        <h1>Welcome to Venom</h1>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 10px 0;">
            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>
            <a href="#" onclick="forgotPassword()" style="font-size: 0.8rem; color: var(--fur-brown); text-decoration: none;">Forgot Password?</a>
        </div>

        <button class="checkout-btn" onclick="handleLogin()">Enter Store</button>
        <button class="checkout-btn" style="background:var(--fur-brown); margin-top:10px" onclick="handleRegister()">Sign Up</button>
    </div>
</div>

<!-- ✅ MAIN CONTENT -->
<div id="main-content" style="display: none;">

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">VENOM</div>
        <nav>
            <a href="#" onclick="showPage('home')">Home</a>
            <a href="#" onclick="showPage('categories')">Categories</a>
            <a href="#" onclick="showPage('orders')">My Orders</a>

            <span id="user-display" style="color: var(--gold-light); margin-right: 15px; font-weight: bold;"></span>

            <button id="theme-toggle" class="icon-btn" onclick="toggleTheme()">☀️</button>
            <button class="icon-btn" onclick="toggleSavedDrawer()">❤️ <span id="saved-count">0</span></button>
            <button class="icon-btn" onclick="showPage('cart')">🛒 <span id="cart-count">0</span></button>

            <button class="login-trigger" onclick="location.reload()">Logout</button>
        </nav>
    </header>

    <div class="container">

        <!-- ✅ HOME PAGE -->
        <section id="home-view">
            <h2 class="section-title">New Arrivals</h2>
            <div id="product-grid" class="home-items-grid"></div>
        </section>

        <!-- ✅ CART PAGE -->
        <section id="cart-view" style="display: none;">
            <h2 class="section-title">Your Shopping Cart</h2>

            <div class="cart-wrapper">
                <div id="cart-items-container" class="cart-items-column"></div>

                <aside class="summary-sidebar">
                    <div class="summary-card">
                        <h3>Order Summary</h3>

                        <div class="row">
                            <span>Subtotal</span>
                            <span id="subtotal-val">₹0.00</span>
                        </div>

                        <div class="row discount-text" id="discount-row" style="display: none;">
                            <span>Discount (10%)</span>
                            <span id="discount-val">-₹0.00</span>
                        </div>

                        <div class="row">
                            <span>Shipping</span>
                            <span class="free-shipping">FREE</span>
                        </div>

                        <hr>

                        <div class="row total-row">
                            <span>Total</span>
                            <span id="total-val">₹0.00</span>
                        </div>

                        <div class="promo-box">
                            <input type="text" id="promo-input" placeholder="Code: SAVE10">
                            <button onclick="applyPromoCode()">Apply</button>
                        </div>

                        <button class="checkout-btn" onclick="checkout()">
                            Checkout Now
                        </button>
                    </div>
                </aside>
            </div>
        </section>

    </div>

    <!-- ✅ SAVED DRAWER -->
    <div id="saved-drawer" class="drawer">
        <div class="drawer-content">
            <span class="close-btn" onclick="toggleSavedDrawer()">&times;</span>
            <h2>Your Favorites ❤️</h2>
            <div id="saved-items-container"></div>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
